<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Note | The Study Ledger</title>

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Dorrmant"
    >

    <link
        rel="apple-touch-icon"
        href="icons/icon-512.png"
    >


    <!-- ==========================================
         Fonts
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         Main CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ==========================================
         Markdown Renderer
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>

</head>


<body>


    <!-- ==========================================
         Note Page
    ========================================== -->

    <main class="note-page">


        <!-- Back Button -->

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>


        <!-- Note Card -->

        <article class="card note-card">


            <!-- Note Title -->

            <h1 id="noteTitle"></h1>


            <!-- Note Metadata -->

            <p id="noteMeta"></p>


            <hr>


            <!-- Note Content -->

            <div id="noteContent"></div>


        </article>


    </main>


    <!-- ==========================================
         Note JavaScript
         
         IMPORTANT:
         note.js is in the ROOT directory,
         not inside /js/
    ========================================== -->

    <script src="note.js?v=1.0.3"></script>


</body>

</html>
